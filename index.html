<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>one+</title><script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script><script src="https://unpkg.com/@vkontakte/vkui/dist/vkui.js"></script><link rel="stylesheet" href="https://unpkg.com/@vkontakte/vkui/dist/vkui.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff}.feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}.item{height:100vh;scroll-snap-align:start;position:relative;background:#222}.vid{width:100%;height:100%;object-fit:cover}.overlay{position:absolute;bottom:100px;left:16px;right:80px;z-index:2}.gifts{position:absolute;bottom:24px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:3}.gbtn{padding:10px 18px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:24px;font-size:14px;cursor:pointer}.gbtn:active{transform:scale(.92)}.top{position:absolute;top:16px;left:16px;right:16px;display:flex;gap:10px;z-index:3;overflow-x:auto}.top::-webkit-scrollbar{display:none}.tcard{flex:0 0 140px;height:200px;border-radius:14px;position:relative;overflow:hidden;cursor:pointer}.tcard img{width:100%;height:100%;object-fit:cover}.tinfo{position:absolute;bottom:0;left:0;right:0;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:11px}.rank{position:absolute;top:8px;left:8px;background:#ff3b30;padding:3px 8px;border-radius:8px;font-size:11px;font-weight:700}.anim{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:100px;animation:pop 1.8s forwards;pointer-events:none;z-index:10}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-250%) scale(.8)}}.snack{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);padding:12px 24px;border-radius:14px;z-index:20;border:1px solid rgba(255,255,255,.2)}.back{position:absolute;top:16px;left:16px;z-index:5;background:rgba(0,0,0,.7);color:#fff;border:none;padding:10px 18px;border-radius:22px;cursor:pointer;font-size:14px}.err{position:fixed;inset:0;background:#111;color:#f55;padding:20px;overflow:auto;font-family:monospace;font-size:12px;white-space:pre-wrap;z-index:999}.logo{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:5;font-size:20px;font-weight:700;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.appid{position:fixed;bottom:8px;right:8px;font-size:10px;color:rgba(255,255,255,.3);z-index:1}</style></head><body><div id="root"><div style="padding:20px;color:#888">Загрузка...</div></div><div class="appid">App ID: 54694859</div><script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const APP_ID = 54694859;

let vkReady = false;
try {
  if (typeof vkBridge !== 'undefined') {
    vkBridge.send('VKWebAppInit').then(() => { vkReady = true; console.log('✅ VK Bridge OK, App ID:', APP_ID); }).catch(e => console.warn('⚠️ VK Bridge:', e.message));
  }
} catch(e) { console.warn('VK Bridge not available'); }

async function vkApi(method, params) {
  if (!vkReady || typeof vkBridge === 'undefined') throw new Error('VK not ready');
  const res = await vkBridge.send('VKWebAppCallAPIMethod', { method, params });
  if (res.error) throw new Error(res.error.error_msg);
  return res.response;
}

const GIFTS = {
  coffee:  { e:'☕', n:'Кофе',      p:1,  vk:'gift_coffee' },
  fire:    { e:'🔥', n:'Огонь',     p:5,  vk:'gift_fire' },
  rocket:  { e:'🚀', n:'Ракета',    p:20, vk:'gift_rocket' },
  diamond: { e:'💎', n:'Бриллиант', p:50, vk:'gift_diamond' }
};

function getMockStreams() {
  return Array.from({length:12}, (_, i) => ({
    id: i+1, owner_id: 100+i,
    author: `User_${i+1}`,
    title: `one+ Stream #${i+1}`,
    viewers: Math.floor(Math.random()*2000),
    likes: Math.floor(Math.random()*800),
    comments: Math.floor(Math.random()*200),
    thumb: `https://picsum.photos/400/700?random=${i+1}`,
    video: `https://picsum.photos/400/700?random=${i+20}`
  })).map(s => ({...s, rank: (s.viewers*1.5) + s.likes + s.comments}))
    .sort((a,b) => b.rank - a.rank);
}

async function loadStreams() {
  try {
    if (!vkReady) throw new Error('VK not ready, using mock');
    const search = await vkApi('video.search', { q:'#oneplus', live:1, count:15, sort:0 });
    if (!search?.items?.length) throw new Error('No streams found');
    const detailed = await Promise.all(search.items.slice(0,12).map(async v => {
      try {
        const info = await vkApi('video.get', { videos:`${v.owner_id}_${v.id}`, fields:'views,likes,comments' });
        const vid = info?.items?.[0] || v;
        return {
          id: vid.id, owner_id: vid.owner_id,
          author: `User ${vid.owner_id}`,
          title: vid.title || 'one+ Stream',
          viewers: vid.views || 0,
          likes: vid.likes?.count || 0,
          comments: vid.comments?.count || 0,
          thumb: vid.photo_640 || `https://picsum.photos/400/700?random=${vid.id}`,
          video: vid.player || `https://picsum.photos/400/700?random=${vid.id+50}`
        };
      } catch { return null; }
    }));
    return detailed.filter(Boolean).map(s => ({...s, rank:(s.viewers*1.5)+s.likes+s.comments})).sort((a,b)=>b.rank-a.rank);
  } catch(e) {
    console.warn('⚠️ Load error:', e.message, '→ using mock');
    return getMockStreams();
  }
}

function TopBar({ streams, onPick }) {
  return (
    <div className="top">
      {streams.slice(0,8).map((s,i) => (
        <div key={s.id} className="tcard" onClick={() => onPick(s)}>
          <img src={s.thumb} alt=""/>
          <div className="rank">#{i+1}</div>
          <div className="tinfo"><b>{s.author}</b><br/>👁 {s.viewers.toLocaleString()}</div>
        </div>
      ))}
    </div>
  );
}

function Feed({ streams, onPick }) {
  return (
    <div className="feed">
      {streams.map(s => (
        <div key={s.id} className="item" onClick={() => onPick(s)}>
          <img className="vid" src={s.video} alt=""/>
          <div className="overlay">
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
              <div style={{width:44,height:44,borderRadius:'50%',background:'#444',overflow:'hidden'}}>
                <img src={s.thumb} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
              </div>
              <div>
                <div style={{fontWeight:600,fontSize:16}}>{s.author}</div>
                <div style={{color:'rgba(255,255,255,.7)',fontSize:12}}>🔴 В эфире</div>
              </div>
            </div>
            <div style={{fontSize:14,opacity:.95}}>{s.title}</div>
            <div style={{marginTop:10,display:'flex',gap:14,fontSize:13,color:'rgba(255,255,255,.85)'}}>
              <span>👁 {s.viewers.toLocaleString()}</span>
              <span>❤ {s.likes}</span>
              <span>💬 {s.comments}</span>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function Player({ stream, onBack }) {
  const [anim, setAnim] = useState(null);
  const [snack, setSnack] = useState(null);

  const sendGift = async (key) => {
    const g = GIFTS[key];
    try {
      if (vkReady) {
        const res = await vkBridge.send('VKWebAppShowOrderBox', { type:'item', item:g.vk });
        if (res.status === 'success' || res.result === 1) {
          setSnack(`✅ ${g.e} ${g.n} отправлен!`);
        } else {
          setSnack('❌ Оплата отменена');
        }
      } else {
        setSnack(`🎁 [DEMO] ${g.e} ${g.n} — VK Pay работает только внутри VK`);
      }
      setAnim(g.e);
      setTimeout(() => setAnim(null), 1800);
      setTimeout(() => setSnack(null), 2800);
    } catch(e) {
      setSnack(`🎁 [DEMO] ${g.e} ${g.n}`);
      setAnim(g.e);
      setTimeout(() => setAnim(null), 1800);
      setTimeout(() => setSnack(null), 2800);
    }
  };

  return (
    <div style={{height:'100vh',position:'relative',background:'#000'}}>
      <img className="vid" src={stream.video} alt=""/>
      <button className="back" onClick={onBack}>← Назад</button>
      <div className="logo">one+</div>
      <div className="overlay">
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}>
          <div style={{width:52,height:52,borderRadius:'50%',background:'#444',overflow:'hidden'}}>
            <img src={stream.thumb} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
          </div>
          <div>
            <div style={{fontWeight:600,fontSize:18}}>{stream.author}</div>
            <div style={{color:'rgba(255,255,255,.8)',fontSize:13}}>🔴 В эфире • 👁 {stream.viewers.toLocaleString()}</div>
          </div>
        </div>
        <div style={{fontSize:15}}>{stream.title}</div>
      </div>
      <div className="gifts">
        {Object.entries(GIFTS).map(([k,g]) => (
          <button key={k} className="gbtn" onClick={() => sendGift(k)}>{g.e} {g.p}</button>
        ))}
      </div>
      {anim && <div className="anim">{anim}</div>}
      {snack && <div className="snack">{snack}</div>}
    </div>
  );
}

function App() {
  const [view, setView] = useState('feed');
  const [stream, setStream] = useState(null);
  const [streams, setStreams] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    loadStreams()
      .then(data => { setStreams(data); setLoading(false); })
      .catch(e => { setError(e.message); setLoading(false); });
  }, []);

  if (error) return <div className="err">❌ Ошибка: {error}</div>;
  if (loading) return <div style={{padding:20,textAlign:'center'}}>⏳ Загрузка стримов...</div>;
  if (!streams.length) return <div style={{padding:20}}>Нет стримов по тегу #oneplus</div>;

  return (
    <div style={{height:'100vh',background:'#000'}}>
      {view === 'feed' && (
        <>
          <div className="logo">one+</div>
          <TopBar streams={streams} onPick={(s) => { setStream(s); setView('player'); }}/>
          <Feed streams={streams} onPick={(s) => { setStream(s); setView('player'); }}/>
        </>
      )}
      {view === 'player' && stream && <Player stream={stream} onBack={() => setView('feed')}/>}
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
} catch(e) {
  document.getElementById('root').innerHTML = `<div class="err">❌ React error: ${e.message}\n${e.stack}</div>`;
}
</script></body></html>
