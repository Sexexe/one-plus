<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>one+</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;overflow:hidden}
    .feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
    .item{height:100vh;scroll-snap-align:start;position:relative;background:#222}
    .vid{width:100%;height:100%;object-fit:cover}
    .overlay{position:absolute;bottom:100px;left:16px;right:80px;z-index:2}
    .gifts{position:absolute;bottom:24px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:3}
    .gbtn{padding:10px 18px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:24px;font-size:14px;cursor:pointer}
    .gbtn:active{transform:scale(.92)}
    /* Карточки топа сдвинуты ниже, чтобы не перекрывались */
    .top{position:absolute;top:70px;left:16px;right:16px;display:flex;gap:10px;z-index:3;overflow-x:auto}
    .top::-webkit-scrollbar{display:none}
    .tcard{flex:0 0 140px;height:200px;border-radius:14px;position:relative;overflow:hidden;cursor:pointer}
    .tcard img{width:100%;height:100%;object-fit:cover}
    .tinfo{position:absolute;bottom:0;left:0;right:0;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:11px}
    .rank{position:absolute;top:8px;left:8px;background:#ff3b30;padding:3px 8px;border-radius:8px;font-size:11px;font-weight:700}
    .anim{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:100px;animation:pop 1.8s forwards;pointer-events:none;z-index:10}
    @keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-250%) scale(.8)}}
    .snack{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);padding:12px 24px;border-radius:14px;z-index:20}
    .back{position:absolute;top:16px;left:16px;z-index:5;background:rgba(0,0,0,.7);color:#fff;border:none;padding:10px 18px;border-radius:22px;cursor:pointer}
    /* Логотип и кнопка "?" только в шапке ленты */
    .header{position:absolute;top:0;left:0;right:0;height:60px;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(to bottom,rgba(0,0,0,.6) 0%,transparent 100%)}
    .logo{width:50px;height:auto}
    .logo img{width:100%;height:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.7))}
    .help-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:18px;font-weight:700;cursor:pointer;backdrop-filter:blur(10px)}
    .help-btn:active{transform:scale(.95)}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px)}
    .modal{background:#1a1a1a;border-radius:20px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;padding:24px;position:relative}
    .modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:20px;cursor:pointer}
    .modal h2{margin-bottom:16px;font-size:22px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .modal h3{margin:20px 0 10px;font-size:16px;color:#667eea}
    .modal p{margin-bottom:12px;font-size:14px;line-height:1.6;color:rgba(255,255,255,.9)}
    .modal ol{margin-left:20px;margin-bottom:16px}
    .modal li{margin-bottom:10px;font-size:14px;line-height:1.6}
    .modal .tip{background:rgba(102,126,234,.1);border-left:3px solid #667eea;padding:12px;margin:16px 0;border-radius:8px;font-size:13px}
    .modal .hashtag{background:rgba(255,59,48,.2);color:#ff3b30;padding:2px 8px;border-radius:6px;font-weight:600}
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const APP_ID = 54694859;
    let vkReady = false;
    let view = 'feed';
    let currentStream = null;
    let streams = [];
    let showHelp = false;

    const GIFTS = {
      coffee:  { e:'', n:'Кофе',      p:1 },
      fire:    { e:'🔥', n:'Огонь',     p:5 },
      rocket:  { e:'🚀', n:'Ракета',    p:20 },
      diamond: { e:'💎', n:'Бриллиант', p:50 }
    };

    function getMockStreams() {
      return Array.from({length:12}, (_, i) => ({
        id: i+1,
        author: `User_${i+1}`,
        title: `one+ Stream #${i+1}`,
        viewers: Math.floor(Math.random()*2000),
        likes: Math.floor(Math.random()*800),
        comments: Math.floor(Math.random()*200),
        thumb: `https://picsum.photos/400/700?random=${i+1}`,
        video: `https://picsum.photos/400/700?random=${i+20}`
      })).map(s => ({...s, rank: (s.viewers*1.5) + s.likes + s.comments}))
        .sort((a,b) => b.rank - a.rank);
    }

    function initVK() {
      if (typeof vkBridge !== 'undefined') {
        vkBridge.send('VKWebAppInit')
          .then(() => { vkReady = true; loadStreams(); })
          .catch(e => { console.warn(e); loadStreams(); });
      } else {
        loadStreams();
      }
    }

    async function loadStreams() {
      try {
        if (vkReady) {
          const search = await vkBridge.send('VKWebAppCallAPIMethod', {
            method: 'video.search',
            params: { q:'#oneplus', live:1, count:15, sort:0 }
          });
          if (search.response?.items?.length) {
            streams = search.response.items.slice(0,12).map(v => ({
              id: v.id, author: `User ${v.owner_id}`,
              title: v.title || 'one+ Stream',
              viewers: v.views || Math.floor(Math.random()*1000),
              likes: 0, comments: 0,
              thumb: v.photo_640 || `https://picsum.photos/400/700?random=${v.id}`,
              video: v.player || `https://picsum.photos/400/700?random=${v.id+50}`
            })).map(s => ({...s, rank:(s.viewers*1.5)+s.likes+s.comments}))
              .sort((a,b)=>b.rank-a.rank);
          } else { streams = getMockStreams(); }
        } else { streams = getMockStreams(); }
        render();
      } catch(e) { streams = getMockStreams(); render(); }
    }

    async function sendGift(key) {
      const g = GIFTS[key];
      try {
        if (vkReady) {
          await vkBridge.send('VKWebAppShowOrderBox', { type:'item', item: `gift_${key}` });
          showSnack(`✅ ${g.e} ${g.n} отправлен!`);
        } else { showSnack(`🎁 [DEMO] ${g.e} ${g.n}`); }
        showAnimation(g.e);
      } catch(e) { showSnack(`🎁 [DEMO] ${g.e} ${g.n}`); showAnimation(g.e); }
    }

    function showAnimation(emoji) {
      const anim = document.createElement('div');
      anim.className = 'anim';
      anim.textContent = emoji;
      document.getElementById('app').appendChild(anim);
      setTimeout(() => anim.remove(), 1800);
    }

    function showSnack(text) {
      const snack = document.createElement('div');
      snack.className = 'snack';
      snack.textContent = text;
      document.body.appendChild(snack);
      setTimeout(() => snack.remove(), 2800);
    }

    function render() {
      const app = document.getElementById('app');
      
      if (view === 'feed') {
        app.innerHTML = '';
        
        // Шапка с логотипом и кнопкой "?"
        const header = document.createElement('div');
        header.className = 'header';
        header.innerHTML = `
          <div class="logo"><img src="./logo.png" alt="onePlus"></div>
          <button class="help-btn" onclick="showHelp=true;render()">?</button>
        `;
        app.appendChild(header);

        // Топ стримов (сдвинут ниже шапки)
        const top = document.createElement('div');
        top.className = 'top';
        streams.slice(0,8).forEach((s, i) => {
          const card = document.createElement('div');
          card.className = 'tcard';
          card.innerHTML = `
            <img src="${s.thumb}" alt="">
            <div class="rank">#${i+1}</div>
            <div class="tinfo"><b>${s.author}</b><br/>👁 ${s.viewers.toLocaleString()}</div>
          `;
          card.onclick = () => openStream(s);
          top.appendChild(card);
        });
        app.appendChild(top);

        // Лента
        const feed = document.createElement('div');
        feed.className = 'feed';
        streams.forEach(s => {
          const item = document.createElement('div');
          item.className = 'item';
          item.innerHTML = `
            <img class="vid" src="${s.video}" alt="">
            <div class="overlay">
              <div style="display:flex;align-items:center;gap:10;margin-bottom:10">
                <div style="width:44;height:44;border-radius:50%;background:#444;overflow:hidden">
                  <img src="${s.thumb}" style="width:100%;height:100%;object-fit:cover">
                </div>
                <div>
                  <div style="font-weight:600;font-size:16">${s.author}</div>
                  <div style="color:rgba(255,255,255,.7);font-size:12">🔴 В эфире</div>
                </div>
              </div>
              <div style="font-size:14;opacity:.95">${s.title}</div>
              <div style="margin-top:10;display:flex;gap:14;font-size:13;color:rgba(255,255,255,.85)">
                <span>👁 ${s.viewers.toLocaleString()}</span>
                <span>❤ ${s.likes}</span>
                <span>💬 ${s.comments}</span>
              </div>
            </div>
          `;
          item.onclick = () => openStream(s);
          feed.appendChild(item);
        });
        app.appendChild(feed);

      } else if (view === 'player' && currentStream) {
        const s = currentStream;
        // В плеере только видео, кнопка назад и подарки — без логотипа и "?"
        app.innerHTML = `
          <img class="vid" src="${s.video}" alt="">
          <button class="back" onclick="goBack()">← Назад</button>
          <div class="overlay">
            <div style="display:flex;align-items:center;gap:12;margin-bottom:12">
              <div style="width:52;height:52;border-radius:50%;background:#444;overflow:hidden">
                <img src="${s.thumb}" style="width:100%;height:100%;object-fit:cover">
              </div>
              <div>
                <div style="font-weight:600;font-size:18">${s.author}</div>
                <div style="color:rgba(255,255,255,.8);font-size:13"> В эфире • 👁 ${s.viewers.toLocaleString()}</div>
              </div>
            </div>
            <div style="font-size:15">${s.title}</div>
          </div>
          <div class="gifts">
            ${Object.entries(GIFTS).map(([k,g]) => `
              <button class="gbtn" onclick="sendGift('${k}')">${g.e} ${g.p}</button>
            `).join('')}
          </div>
        `;
      }

      // Модальное окно помощи
      if (showHelp) {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.onclick = (e) => { if (e.target === modal) { showHelp = false; render(); } };
        modal.innerHTML = `
          <div class="modal">
            <button class="modal-close" onclick="showHelp=false;render()">×</button>
            <h2>🎥 Как начать трансляцию в one+</h2>
            
            <h3>📱 Шаг 1: Открой ВКонтакте</h3>
            <p>Зайди в мобильное приложение ВК или на сайт vk.com</p>
            
            <h3> Шаг 2: Начни прямую трансляцию</h3>
            <ol>
              <li>Нажми на иконку камеры в разделе «Истории» или «Видео»</li>
              <li>Выбери «Прямая трансляция»</li>
              <li>Настрой камеру (фронтальная или основная)</li>
            </ol>
            
            <h3>🏷️ Шаг 3: Добавь хэштег</h3>
            <p>В поле описания трансляции обязательно напиши: <span class="hashtag">#oneplus</span></p>
            <div class="tip">⚠️ Без этого хэштега твоя трансляция не попадёт в ленту one+!</div>
            
            <h3>🎬 Шаг 4: Начни снимать</h3>
            <p>Нажми «Начать трансляцию» и покажи свой мир от первого лица!</p>
            
            <h3>🏆 Как попасть в ТОП?</h3>
            <p>Алгоритм one+ ранжирует стримы по формуле:</p>
            <div class="tip"><b>Рейтинг = (Зрители × 1.5) + Лайки + Комментарии</b></div>
            <p>Чем больше людей смотрят и взаимодействуют — тем выше ты в топе!</p>
            
            <h3>💎 Советы по качеству</h3>
            <ol>
              <li><b>Свет:</b> Снимай при хорошем освещении, избегай контрового света</li>
              <li><b>Звук:</b> Используй внешний микрофон или снимай в тихом месте</li>
              <li><b>Стабилизация:</b> Держи телефон двумя руками или используй штатив</li>
              <li><b>Угол:</b> Показывай то, что видишь ты — это фишка POV-формата</li>
            </ol>
            
            <h3>🎁 Получай подарки</h3>
            <p>Зрители могут отправлять тебе виртуальные подарки через VK Pay. Каждый подарок — это голоса ВК, которые ты можешь использовать в экосистеме ВКонтакте.</p>
            
            <h3>💡 Идеи для трансляций</h3>
            <ol>
              <li>🏃 Утренняя пробежка в парке</li>
              <li>🍳 Готовка завтрака с видом из окна</li>
              <li>🎸 Уличное выступление</li>
              <li> Поездка на машине по ночному городу</li>
              <li>🎨 Процесс рисования или творчества</li>
              <li>️ Прогулка по пляжу или лесу</li>
            </ol>
            
            <div class="tip">✨ <b>Главное правило:</b> Показывай свою реальную жизнь — люди устали от идеальных картинок, они хотят настоящую жизнь!</div>
          </div>
        `;
        app.appendChild(modal);
      }
    }

    function openStream(s) { currentStream = s; view = 'player'; render(); }
    function goBack() { view = 'feed'; currentStream = null; render(); }

    window.onload = initVK;
  </script>
</body>
</html>
